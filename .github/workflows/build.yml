
name: Build RED ARENA APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android tools
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses
          echo "$ANDROID_HOME/build-tools/35.0.0" >> $GITHUB_PATH
          echo "ANDROIDSDK=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Install Buildozer
        run: |
          sudo apt update
          sudo apt install -y git zip unzip python3-pip python3-venv \
            autoconf libtool pkg-config zlib1g-dev cmake
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython

      - name: Build APK
        run: |
          . .venv/bin/activate
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RED-ARENA-APK
          path: bin/*.apk
